name: Create Github Issue form Jira

on:
  repository_dispatch: 
    types: [jira-issue-create]

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create Github Issue
        uses: actions/github-script@v8
        with:
          script: |
            const title = context.payload.client_payload.jira_key;
            const body = "Jira Content";

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body
            });
