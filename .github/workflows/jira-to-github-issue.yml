name: Create Github Issue from Jira

on:
  repository_dispatch: 
    types: [jira-issue-create]

jobs:
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Process Jira to Github Issue
        id: sync
        uses: actions/github-script@v7 
        env:
          JIRA_KEY: ${{ github.event.client_payload.jira_key }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
        with:
          script: |
            const { JIRA_KEY, JIRA_BASE_URL, JIRA_API_TOKEN, JIRA_USER_EMAIL } = process.env;
            const auth = Buffer.from(`${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}`).toString("base64");
            const headers = {
              'Authorization': `Basic ${auth}`,
              'Accept': 'application/json',
              'Content-Type': 'application/json'
            };
            
            const actionUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const jiraCommentBody = {
              body: {
                type: "doc", version: 1,
                content: [
                  { type: "paragraph", content: [
                    { text: "Github Action execution started", type: "text", marks: [{ type: "strong" }] }
                  ]},
                  { type: "paragraph", content: [
                    { text: "View run: ", type: "text" },
                    { text: `#${context.runNumber}`, type: "text", marks: [{ type: "link", attrs: { href: actionUrl } }] }
                  ]}
                ]
              }
            };

            try {
              await fetch(`${JIRA_BASE_URL}/rest/api/3/issue/${JIRA_KEY}/comment`, {
                method: 'POST', headers, body: JSON.stringify(jiraCommentBody)
              });
            } catch (e) {
              console.error("Failed to post comment to Jira:", e.message);
            }

            const response = await fetch(`${JIRA_BASE_URL}/rest/api/3/issue/${JIRA_KEY}`, { headers });
            if (!response.ok) throw new Error(`Jira API error: ${response.status}`);
            const data = await response.json();

            const parseADF = (node) => {
              if (!node) return "";
              if (node.type === "text") return node.text;
              if (node.content && Array.isArray(node.content)) {
                return node.content.map(parseADF).join("");
              }
              return (node.type === "paragraph" ? "\n" : "") + (node.content ? node.content.map(parseADF).join("") : "");
            };

            const summary = data.fields.summary || "No Summary";
            const description = parseADF(data.fields.description) || "_No description provided._";
            const jiraUrl = `${JIRA_BASE_URL}/browse/${JIRA_KEY}`;

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[${JIRA_KEY}] ${summary}`,
              body: [
                `## 🔗 Jira Reference`,
                `> **Issue**: [${JIRA_KEY}](${jiraUrl})`,
                `> **Status**: \`${data.fields.status?.name}\` | **Priority**: \`${data.fields.priority?.name}\``,
                '',
                `## 📝 Description`,
                description
              ].join('\n'),
              labels: ['from-jira']
            });

            console.log(`Successfully created GitHub Issue #${issue.data.number}`);
